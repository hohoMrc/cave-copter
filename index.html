<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>穿岩直升機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;900&display=swap">
<style>
  /* 版面：像駕駛艙儀表 —— 上方一排儀表讀數，中間整片是洞穴畫面 */
  /* 刻意只做深色單一主題：場景本身就在地底 */
  :root {
    --rock: #15110f;       /* 頁面底色：玄武岩 */
    --panel: #221b17;      /* 儀表底 */
    --ink: #efe6da;        /* 主要文字 */
    --dust: #9a8a7a;       /* 次要文字：岩粉 */
    --signal: #ff9a2e;     /* 直升機機身的警示橘，唯一強調色 */
    --crystal: #6fe0cf;    /* 洞穴晶石的冷光，只用在場景裡 */
    --font-gauge: "Chakra Petch", "SF Mono", ui-monospace, monospace;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }   /* 標了 hidden 的元素一定隱藏，避免被 .overlay 的 display 蓋掉 */
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }  /* 關掉手機「點兩下放大」 */
  .stage { touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--rock);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 20px;
  }
  h1 {
    margin: 0;
    font-weight: 900;
    font-size: 1.6rem;
    letter-spacing: 0.06em;
    line-height: 1;
  }
  h1 em { font-style: normal; color: var(--signal); }
  .gauges { display: flex; gap: 8px; flex-wrap: wrap; }
  .gauge {
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px 12px;
    background: var(--panel);
    border-radius: 6px;
    min-width: 0;
  }
  .gauge span {
    font-family: var(--font-gauge);
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    color: var(--dust);
    text-transform: uppercase;
  }
  .gauge b {
    font-family: var(--font-gauge);
    font-weight: 700;
    font-size: 1.25rem;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .gauge b small { font-size: 0.7em; color: var(--dust); margin-left: 2px; }
  .gauge.best b { color: var(--signal); }

  .stage {
    position: relative;
    flex: 1;
    min-height: 240px;
    border-radius: 10px;
    overflow: hidden;
    background: #0b0908;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

  /* 目前生效中的道具 */
  .effects {
    position: absolute; left: 12px; top: 10px;
    display: flex; gap: 6px; flex-wrap: wrap;
    pointer-events: none;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 6px;
    border-radius: 999px;
    background: #15110fcc;
    border: 1px solid var(--c);
    font-size: 0.75rem; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .chip b { font-family: var(--font-gauge); color: var(--c); }

  /* 標題畫面的道具說明 */
  .items {
    display: grid; grid-template-columns: auto auto 1fr; gap: 6px 10px;
    align-items: center; text-align: left; font-size: 0.85rem;
  }
  .items i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .items b { font-weight: 500; }
  .items span { color: var(--dust); }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-wrap: wrap;
    justify-content: center; align-items: center; align-content: safe center;
    gap: 20px 36px;
    padding: 20px;
    overflow-y: auto;              /* 畫面太矮時（手機橫放）可以捲動 */
    background: #0b0908b8;
    text-align: center;
  }

  /* 線上排行榜 */
  .board {
    width: min(100%, 17rem);
    display: flex; flex-direction: column; gap: 8px;
    padding: 14px 16px;
    background: #15110fe6;
    border: 1px solid #3a2f28;
    border-radius: 8px;
    text-align: left;
  }
  .board h3 {
    margin: 0;
    font-family: var(--font-gauge);
    font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--dust);
  }
  .board .plays { margin: 0; font-size: 0.85rem; color: var(--dust); }
  .board .plays b { font-family: var(--font-gauge); color: var(--ink); font-size: 1.05rem; }
  .board ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .board li {
    display: grid; grid-template-columns: 1.6rem 1fr auto; gap: 8px; align-items: baseline;
    padding: 3px 6px; border-radius: 4px;
    font-size: 0.88rem;
  }
  .board li .rank { font-family: var(--font-gauge); color: var(--dust); font-variant-numeric: tabular-nums; }
  .board li:first-child .rank { color: var(--signal); }
  .board li .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board li .m { font-family: var(--font-gauge); font-weight: 700; font-variant-numeric: tabular-nums; }
  .board li.me { background: #ff9a2e26; }
  .board .empty { margin: 0; font-size: 0.85rem; color: var(--dust); }

  /* 進榜時輸入名字 */
  .entry { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .entry label { font-size: 0.9rem; color: var(--signal); font-weight: 500; }
  .entry .row { display: flex; gap: 8px; }
  .entry input {
    font: inherit; font-size: 1rem;
    width: 10rem; padding: 8px 12px;
    border-radius: 6px; border: 1px solid #3a2f28;
    background: var(--panel); color: var(--ink);
  }
  .entry input:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
  .entry button { padding: 8px 18px; font-size: 0.95rem; }
  .entry .msg { margin: 0; font-size: 0.8rem; color: var(--dust); min-height: 1.2em; }
  .card { max-width: 28rem; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .card h2 {
    margin: 0;
    font-weight: 900;
    font-size: 2.2rem;
    letter-spacing: 0.08em;
    text-wrap: balance;
  }
  .card h2 em { font-style: normal; color: var(--signal); }
  .card p { margin: 0; line-height: 1.7; text-wrap: pretty; }
  .card .how {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    font-size: 0.88rem; color: var(--dust);
  }
  .card .how b { color: var(--ink); font-weight: 500; }
  .card .readout {
    font-family: var(--font-gauge); font-weight: 700;
    font-size: 3.4rem; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .card .readout small { font-size: 0.4em; color: var(--dust); margin-left: 4px; }
  .card .note { font-size: 0.85rem; color: var(--dust); }
  .card .note.new { color: var(--signal); }
  .card .portrait { font-size: 0.8rem; color: var(--crystal); }

  button {
    font: inherit;
    font-weight: 900;
    font-size: 1.05rem;
    letter-spacing: 0.12em;
    padding: 10px 30px;
    border-radius: 6px;
    border: 0;
    background: var(--signal);
    color: var(--rock);
    cursor: pointer;
    transition: transform .12s, filter .12s;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  button.ghost {
    background: transparent; color: var(--dust);
    border: 1px solid #3a2f28;
    font-weight: 500; font-size: 0.78rem; letter-spacing: 0.06em;
    padding: 6px 14px;
  }
  button.ghost:hover { color: var(--ink); }

  footer {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
    font-size: 0.78rem; color: var(--dust);
  }
  footer .btns { display: flex; gap: 8px; }
  kbd {
    font-family: var(--font-gauge); font-size: 0.72rem;
    padding: 1px 6px; border: 1px solid #3a2f28; border-radius: 4px; color: var(--ink);
  }

  @media (max-width: 560px) {
    h1 { font-size: 1.25rem; }
    .gauge { padding: 4px 9px; }
    .gauge b { font-size: 1rem; }
    .card h2 { font-size: 1.7rem; }
    .card .readout { font-size: 2.6rem; }
    footer .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>穿岩<em>直升機</em></h1>
    <div class="gauges">
      <div class="gauge"><span>Distance</span><b id="dist">0<small>m</small></b></div>
      <div class="gauge"><span>Speed</span><b id="speed">0<small>km/h</small></b></div>
      <div class="gauge best"><span>Best</span><b id="best">0<small>m</small></b></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" aria-label="遊戲畫面：按住上升，放開下降"></canvas>
    <div class="effects" id="effects"></div>

    <div class="overlay" id="titleScreen">
      <div class="card">
        <h2>穿岩<em>直升機</em></h2>
        <p>直升機會自己往前飛。按住讓它爬升，放開讓它下降，別碰到洞頂、洞底和岩柱。飛越遠，速度越快，洞穴也越窄。</p>
        <div class="how">
          <span><b>按住畫面</b> / <b>空白鍵</b> / <b>↑</b> 上升</span>
          <span><b>放開</b> 下降</span>
        </div>
        <div class="items">
          <i style="--c:#6fe0cf"></i><b>護盾</b><span>擋下一次碰撞</span>
          <i style="--c:#c3a6ff"></i><b>慢動作</b><span>5 秒內整個世界變慢</span>
          <i style="--c:#ffd27a"></i><b>縮小</b><span>7 秒內機身變小，容易鑽過縫隙</span>
        </div>
        <button id="startBtn" type="button">起飛</button>
        <p class="portrait" id="portraitTip" hidden>把手機橫放，可以看到更遠的地形</p>
      </div>
      <section class="board" aria-label="線上排行榜"></section>
    </div>

    <div class="overlay" id="pauseScreen" hidden>
      <div class="card">
        <h2>暫停</h2>
        <button id="resumeBtn" type="button">繼續飛行</button>
        <p class="note">按 <kbd>P</kbd> 或 <kbd>Esc</kbd> 也能繼續</p>
      </div>
    </div>

    <div class="overlay" id="overScreen" hidden>
      <div class="card">
        <h2 id="overTitle">墜毀</h2>
        <div class="readout"><span id="finalDist">0</span><small>m</small></div>
        <p class="note" id="finalNote">最高紀錄 0 m</p>
        <form class="entry" id="entryForm" hidden>
          <label for="nameInput">進入前 10 名！留下你的名字</label>
          <div class="row">
            <input id="nameInput" type="text" maxlength="12" autocomplete="nickname" placeholder="最多 12 個字" required>
            <button type="submit" id="submitBtn">送出</button>
          </div>
          <p class="msg" id="entryMsg"></p>
        </form>
        <button id="againBtn" type="button">再飛一次</button>
      </div>
      <section class="board" aria-label="線上排行榜"></section>
    </div>
  </div>

  <footer>
    <span class="keys"><kbd>Space</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> 按住上升　<kbd>P</kbd> 暫停</span>
    <div class="btns">
      <button class="ghost" id="soundBtn" type="button">音效：開</button>
      <button class="ghost" id="pauseBtn" type="button">暫停</button>
    </div>
  </footer>
</div>

<script>
(() => {
  // ===== 畫面與座標 =====
  // 遊戲世界用固定的「邏輯高度」360 單位，不管螢幕多大，物理手感都一樣
  // 寬螢幕會看到更遠的地形；直立的手機上下會多出岩壁（像信箱模式）
  const VH = 360;
  const SEG = 16;                 // 地形每一段的寬度
  const PX_PER_M = 12;            // 多少單位算 1 公尺
  const GRAVITY = 620;            // 放開時往下的加速度
  const LIFT = 1300;               // 按住時往上的推力（會抵掉重力）
  const MAX_UP = -230, MAX_DOWN = 260;  // 上升、下降的最高速度

  // ===== 道具 =====
  // weight：出現機率的比重；time：效果持續秒數（護盾沒有時間限制，撞一次就消失）
  const ITEMS = {
    shield: { name: '護盾',   color: '#6fe0cf', weight: 4 },
    slow:   { name: '慢動作', color: '#c3a6ff', weight: 3, time: 5 },
    mini:   { name: '縮小',   color: '#ffd27a', weight: 3, time: 7 },
  };
  // ===== 場景 =====
  // 每飛 ZONE_M 公尺換一個場景，5 個場景跑完會循環，區號持續往上加
  // 換場景時，岩壁顏色會在 BLEND_M 公尺內漸變過去，從遠處就能看到前方的新場景
  const ZONE_M = 250, BLEND_M = 40;
  const SCENES = [
    { name: '玄武岩洞', bg: '#1c1714', far: '#241d19', wall: '#45372e', edge: '#7a6250', block: '#5a4738', blockEdge: '#8a705c', crystal: '#6fe0cf', ambient: null },
    { name: '冰晶洞窟', bg: '#0e1822', far: '#152536', wall: '#36566f', edge: '#a9d8f0', block: '#557d9c', blockEdge: '#cdeeff', crystal: '#e8fbff', ambient: 'snow' },
    { name: '熔岩地帶', bg: '#1a0b07', far: '#2a120b', wall: '#3a1a12', edge: '#ff6a2a', block: '#4a2016', blockEdge: '#ff8a3a', crystal: '#ffb347', ambient: 'ember' },
    { name: '翡翠礦坑', bg: '#0b1712', far: '#11241a', wall: '#2a4632', edge: '#7fcf8a', block: '#3a5c42', blockEdge: '#9fe0a8', crystal: '#7dffb0', ambient: 'spore' },
    { name: '幽光深淵', bg: '#0b0916', far: '#141024', wall: '#272040', edge: '#9a7cff', block: '#352a54', blockEdge: '#b8a0ff', crystal: '#ff7ce0', ambient: 'spore' },
  ];
  const ZONE_LEN = ZONE_M * PX_PER_M, BLEND_LEN = BLEND_M * PX_PER_M;
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const SCENE_RGB = SCENES.map(s => Object.fromEntries(Object.entries(s).filter(([, v]) => typeof v === 'string' && v[0] === '#').map(([k, v]) => [k, hexRgb(v)])));
  const zoneAt = x => Math.max(0, Math.floor(x / ZONE_LEN));
  const sceneOf = zone => SCENES[zone % SCENES.length];
  // 取得世界座標 x 處的某個顏色；在場景交界處把前後兩個場景的顏色混合
  function sceneColor(x, key) {
    const z = zoneAt(x), local = x - z * ZONE_LEN;
    const cur = SCENE_RGB[z % SCENES.length][key];
    if (z === 0 || local >= BLEND_LEN) return `rgb(${cur})`;
    const prev = SCENE_RGB[(z - 1) % SCENES.length][key], t = local / BLEND_LEN;
    return `rgb(${cur.map((c, i) => Math.round(prev[i] + (c - prev[i]) * t))})`;
  }

  const SLOW_FACTOR = 0.55;       // 慢動作時世界的速度倍率
  const MINI_SIZE = 0.6;          // 縮小時機身的大小倍率
  function pickItemType() {
    const total = Object.values(ITEMS).reduce((s, it) => s + it.weight, 0);
    let r = Math.random() * total;
    for (const [k, it] of Object.entries(ITEMS)) { if ((r -= it.weight) < 0) return k; }
    return 'shield';
  }

  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const ui = {
    dist: $('dist'), speed: $('speed'), best: $('best'),
    title: $('titleScreen'), pause: $('pauseScreen'), over: $('overScreen'),
    finalDist: $('finalDist'), finalNote: $('finalNote'), overTitle: $('overTitle'),
    soundBtn: $('soundBtn'), pauseBtn: $('pauseBtn'), portraitTip: $('portraitTip'),
    effects: $('effects'),
  };

  let W = 0, H = 0, DPR = 1, scale = 1, VW = 600, offY = 0;
  let mode = 'title';             // title | play | pause | over
  let G = null;                   // 這一局的狀態
  let best = 0;
  let holding = false;
  let soundOn = true, audio = null, rotorNode = null;
  let overAt = 0;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  function loadBest() { try { return Number(localStorage.getItem('copter-best')) || 0; } catch { return 0; } }
  function saveBest(v) { try { localStorage.setItem('copter-best', String(v)); } catch {} }

  // ===== 尺寸 =====
  function resize() {
    const r = cvs.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    // 至少要看得到 520 單位寬，太窄的螢幕就整體縮小
    scale = Math.min(H / VH, W / 520);
    VW = W / scale;
    offY = (H / scale - VH) / 2;  // 上下多出的空間（邏輯單位）
    ui.portraitTip.hidden = !(H > W * 1.1);
    if (G) ensureTerrain();
    if (mode !== 'play') draw();
  }
  new ResizeObserver(resize).observe(cvs);

  // ===== 音效：引擎聲用持續的低頻振盪器，其餘用短音 =====
  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; }
  }
  function rotorStart() {
    if (!audio || rotorNode) return;
    const o = audio.createOscillator(), lfo = audio.createOscillator();
    const g = audio.createGain(), lg = audio.createGain(), f = audio.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 55;
    lfo.frequency.value = 14; lg.gain.value = 0.02;  // 讓聲音一下一下的，像旋翼拍打
    f.type = 'lowpass'; f.frequency.value = 420;
    g.gain.value = 0;
    lfo.connect(lg).connect(g.gain);
    o.connect(f).connect(g).connect(audio.destination);
    o.start(); lfo.start();
    rotorNode = { o, lfo, g };
  }
  function rotorUpdate() {
    if (!rotorNode || !audio) return;
    const on = soundOn && mode === 'play';
    const t = audio.currentTime;
    rotorNode.g.gain.setTargetAtTime(on ? (holding ? 0.05 : 0.03) : 0, t, 0.08);
    rotorNode.o.frequency.setTargetAtTime(holding ? 72 : 55, t, 0.15);
  }
  function tone(freq, dur = 0.15, type = 'sine', vol = 0.08, slide = 0) {
    if (!soundOn || !audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function crashSound() {
    if (!soundOn || !audio) return;
    const t = audio.currentTime, len = 0.7;
    const buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
    const src = audio.createBufferSource(), g = audio.createGain(), f = audio.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(120, t + len);
    g.gain.value = 0.35;
    src.buffer = buf;
    src.connect(f).connect(g).connect(audio.destination);
    src.start();
  }

  // ===== 地形產生 =====
  // 用「中心線隨機漫步 + 通道寬度隨距離變窄」產生一段段的洞頂與洞底
  function gapAt(x) { return Math.max(150, 290 - x * 0.0045); }

  function newGame() {
    G = {
      cam: 0,                     // 鏡頭在世界中的 x
      y: VH / 2, vy: 0,           // 直升機高度與垂直速度
      speed: 190,
      segs: [], blocks: [], smoke: [], debris: [], crystals: [],
      genX: 0, center: VH / 2, cvel: 0,
      nextBlock: 700,             // 一開始先給一段沒有岩柱的暖身區
      items: [], nextItem: 1100, popups: [],
      shield: false,              // 有沒有護盾
      slow: 0, mini: 0,           // 慢動作、縮小剩下的秒數
      inv: 0,                     // 護盾破掉後短暫無敵的秒數
      zone: 0, banner: null,      // 目前在第幾區（從 0 算）、進入新區時的標題
      ambient: [],                // 場景的環境粒子：雪花、火星、孢子
      shake: 0, t: 0, dead: false,
    };
    ensureTerrain();
  }

  function heliX() { return VW * 0.26; }

  function ensureTerrain() {
    const need = G.cam + VW + SEG * 4;
    while (G.genX < need) {
      const x = G.genX;
      const gap = gapAt(x);
      if (x > 400) {
        // 中心線慢慢飄移，速度也會隨機改變，形成起伏的洞穴
        G.cvel = clamp(G.cvel + rand(-3.2, 3.2), -9, 9);
        G.center += G.cvel;
      }
      const lo = 14 + gap / 2, hi = VH - 14 - gap / 2;
      if (G.center < lo) { G.center = lo; G.cvel = Math.abs(G.cvel) * 0.5; }
      if (G.center > hi) { G.center = hi; G.cvel = -Math.abs(G.cvel) * 0.5; }
      // 加一點細碎的凹凸，讓岩壁看起來不那麼平滑
      const top = G.center - gap / 2 + rand(-4, 4);
      const bot = G.center + gap / 2 + rand(-4, 4);
      G.segs.push({ x, top, bot, wall: sceneColor(x, 'wall'), edge: sceneColor(x, 'edge') });

      // 偶爾在岩壁上長出發光晶石（純裝飾）
      if (Math.random() < 0.06) G.crystals.push({ x: x + rand(0, SEG), y: Math.random() < 0.5 ? top : bot, up: Math.random() < 0.5, s: rand(5, 11), color: sceneColor(x, 'crystal') });

      // 岩柱障礙物：保證上下至少有一邊留下夠寬的通道
      if (x >= G.nextBlock) {
        const h = rand(46, Math.min(115, gap * 0.48));
        const room = gap - h;
        const pass = 74;           // 留給直升機的最小通道
        let by;
        if (room - pass <= 0) by = top + (gap - h) / 2;
        else by = Math.random() < 0.5 ? top + rand(0, room - pass) : bot - h - rand(0, room - pass);
        G.blocks.push({ x, y: by, w: 26, h, color: sceneColor(x, 'block'), edge: sceneColor(x, 'blockEdge') });
        G.nextBlock = x + Math.max(200, rand(300, 460) - x * 0.004);
      }

      // 道具：放在通道正中央，並避開岩柱附近，免得吃道具就撞上去
      if (x >= G.nextItem) {
        const nearBlock = G.blocks.some(b => Math.abs(b.x - x) < 90) || G.nextBlock - x < 90;
        if (nearBlock) G.nextItem = x + SEG * 3;
        else {
          G.items.push({ x: x + SEG / 2, y: G.center, type: pickItemType(), p: rand(0, 6.28) });
          G.nextItem = x + rand(1000, 1600);
        }
      }
      G.genX += SEG;
    }
    // 移除已經飛過的地形
    const left = G.cam - SEG * 4;
    while (G.segs.length && G.segs[0].x < left) G.segs.shift();
    G.blocks = G.blocks.filter(b => b.x + b.w > left);
    G.items = G.items.filter(it => it.x > left && !it.taken);
    G.crystals = G.crystals.filter(c => c.x > left);
  }

  // ===== 遊戲流程 =====
  function setMode(m) {
    mode = m;
    ui.title.hidden = m !== 'title';
    ui.pause.hidden = m !== 'pause';
    ui.over.hidden = m !== 'over';
    ui.pauseBtn.textContent = m === 'pause' ? '繼續' : '暫停';
    ui.pauseBtn.disabled = !(m === 'play' || m === 'pause');
    rotorUpdate();
  }

  // ===== 線上排行榜（後端在 EC2：server/game_api.py）=====
  const API = 'https://hoho-game.duckdns.org/game-api';
  let online = { ok: false, loading: true, plays: null, top: [] };
  let runId = null;               // 這一局在伺服器上的編號，上傳成績時用
  let myEntry = null;             // 剛上榜的那筆，在榜上標示出來
  const entryForm = $('entryForm'), nameInput = $('nameInput'), entryMsg = $('entryMsg');

  async function api(path, body) {
    const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
    const res = await fetch(API + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || '連線失敗');
    return data;
  }

  async function loadStats() {
    try { online = { ok: true, ...(await api('/stats')) }; }
    catch { online = { ...online, ok: false, loading: false }; }
    renderBoards();
  }

  function renderBoards() {
    for (const el of document.querySelectorAll('.board')) {
      el.replaceChildren();
      const h = document.createElement('h3');
      h.textContent = '線上排行榜';
      el.append(h);
      if (!online.ok) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = online.loading ? '讀取中…' : '排行榜暫時連不上，遊戲還是可以照常玩';
        el.append(p);
        continue;
      }
      const plays = document.createElement('p');
      plays.className = 'plays';
      plays.innerHTML = `已被遊玩 <b>${Number(online.plays).toLocaleString()}</b> 次`;
      el.append(plays);
      if (!online.top.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = '還沒有人上榜，第一名就是你';
        el.append(p);
        continue;
      }
      const ol = document.createElement('ol');
      let marked = false;
      online.top.forEach((row, i) => {
        const li = document.createElement('li');
        // 名字是玩家輸入的，一律用 textContent 放進去，避免被塞入 HTML
        const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = i + 1;
        const name = document.createElement('span'); name.className = 'name'; name.textContent = row.name;
        const m = document.createElement('span'); m.className = 'm'; m.textContent = `${row.distance.toLocaleString()} m`;
        if (!marked && myEntry && row.name === myEntry.name && row.distance === myEntry.distance) { li.className = 'me'; marked = true; }
        li.append(rank, name, m);
        ol.append(li);
      });
      el.append(ol);
    }
  }

  // 這個距離能不能進前 10 名
  function qualifies(d) {
    if (!online.ok || !runId || d <= 0) return false;
    return online.top.length < 10 || d > online.top[online.top.length - 1].distance;
  }

  function loadName() { try { return localStorage.getItem('copter-name') || ''; } catch { return ''; } }
  function saveName(v) { try { localStorage.setItem('copter-name', v); } catch {} }

  entryForm.addEventListener('submit', async e => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) { entryMsg.textContent = '請輸入名字'; return; }
    const distance = Number(entryForm.dataset.distance);
    $('submitBtn').disabled = true;
    entryMsg.textContent = '送出中…';
    try {
      online = { ok: true, ...(await api('/scores', { run_id: runId, name, distance })) };
      saveName(name);
      myEntry = { name: name.slice(0, 12), distance };
      runId = null;
      entryForm.hidden = true;
      const rank = online.top.findIndex(r => r.name === myEntry.name && r.distance === distance);
      ui.finalNote.textContent = rank >= 0 ? `登上線上排行榜第 ${rank + 1} 名！` : '已送出';
      ui.finalNote.classList.add('new');
      renderBoards();
    } catch (err) {
      entryMsg.textContent = err.message;
    } finally {
      $('submitBtn').disabled = false;
    }
  });

  function startGame() {
    initAudio();
    if (audio && audio.state === 'suspended') audio.resume();
    rotorStart();
    // 通知伺服器開了一局（遊玩次數 +1）；連不上也不影響遊戲
    runId = null;
    myEntry = null;
    api('/runs', {}).then(r => { runId = r.run_id; online.plays = r.plays; }).catch(() => {});
    newGame();
    holding = false;
    G.banner = { zone: 0, life: 2.2 };
    setMode('play');
    last = performance.now();
  }

  function togglePause() {
    if (G && G.dead) return;      // 墜毀動畫播放中不能暫停
    if (mode === 'play') setMode('pause');
    else if (mode === 'pause') { setMode('play'); last = performance.now(); }
  }

  function meters() { return Math.floor(G.cam / PX_PER_M); }

  function crash() {
    G.dead = true;
    G.shake = 0.5;
    const hx = G.cam + heliX();
    for (let i = 0; i < 40; i++) {
      const a = rand(0, Math.PI * 2), v = rand(60, 320);
      G.debris.push({ x: hx, y: G.y, vx: Math.cos(a) * v + G.speed * 0.3, vy: Math.sin(a) * v, life: rand(0.5, 1.3), hot: Math.random() < 0.6 });
    }
    crashSound();
    const d = meters();
    const isNew = d > best;
    if (isNew) { best = d; saveBest(best); }
    ui.finalDist.textContent = d.toLocaleString();
    ui.finalNote.textContent = isNew ? '個人新紀錄！' : `個人最高 ${best.toLocaleString()} m`;
    ui.finalNote.classList.toggle('new', isNew);
    ui.overTitle.textContent = d < 50 ? '起飛就墜毀' : `墜毀於第 ${G.zone + 1} 區・${sceneOf(G.zone).name}`;
    // 夠資格進前 10 名就顯示輸入名字的表單
    const canEnter = qualifies(d);
    entryForm.hidden = !canEnter;
    entryForm.dataset.distance = d;
    entryMsg.textContent = '';
    if (canEnter && !nameInput.value) nameInput.value = loadName();
    if (!canEnter) loadStats();   // 順便更新排行榜與遊玩次數
    else renderBoards();
    // 有實體鍵盤時自動把游標放進輸入框（手機上不自動跳出鍵盤）
    if (canEnter && matchMedia('(pointer: fine)').matches) setTimeout(() => nameInput.focus(), 750);
    overAt = performance.now();
    // 先讓爆炸播一下，再跳出結算畫面
    setTimeout(() => { if (G && G.dead && mode === 'play') setMode('over'); updateHud(); }, 700);
  }

  // 吃到道具
  function collect(it) {
    it.taken = true;
    const def = ITEMS[it.type];
    if (it.type === 'shield') G.shield = true;
    else G[it.type] = def.time;   // 再吃一次同樣的道具會把時間重新補滿
    G.popups.push({ x: it.x, y: it.y, text: def.name + '！', color: def.color, life: 1 });
    for (let i = 0; i < 14; i++) {
      const a = rand(0, Math.PI * 2), v = rand(40, 140);
      G.debris.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rand(0.3, 0.7), color: def.color });
    }
    tone(it.type === 'slow' ? 520 : 760, 0.18, 'triangle', 0.07, it.type === 'slow' ? -260 : 420);
  }

  // 護盾擋下一次碰撞
  function breakShield(hx) {
    G.shield = false;
    G.inv = 1.2;
    G.shake = 0.25;
    for (let i = 0; i < 20; i++) {
      const a = rand(0, Math.PI * 2), v = rand(80, 200);
      G.debris.push({ x: hx, y: G.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.6), color: ITEMS.shield.color });
    }
    tone(300, 0.3, 'square', 0.05, 500);
  }

  // ===== 每一幀的邏輯 =====
  function update(dt) {
    // 道具計時用真實時間；慢動作時其他東西都用放慢後的時間
    if (!G.dead) {
      G.slow = Math.max(0, G.slow - dt);
      G.mini = Math.max(0, G.mini - dt);
      G.inv = Math.max(0, G.inv - dt);
      if (G.slow > 0) dt *= SLOW_FACTOR;
    }
    G.t += dt;
    G.shake = Math.max(0, G.shake - dt);
    for (const p of G.popups) { p.y -= 30 * dt; p.life -= dt; }
    G.popups = G.popups.filter(p => p.life > 0);

    // 碎片與煙霧就算墜毀後也繼續動
    for (const p of G.debris) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.vx *= 0.98; p.life -= dt; }
    G.debris = G.debris.filter(p => p.life > 0);
    for (const s of G.smoke) { s.x += s.vx * dt; s.y += s.vy * dt; s.r += 14 * dt; s.life -= dt; }
    for (const a of G.ambient) { a.x += a.vx * dt; a.y += a.vy * dt + (a.kind === 'snow' ? Math.sin(G.t * 2 + a.x) * 8 * dt : 0); a.life -= dt; }
    G.ambient = G.ambient.filter(a => a.life > 0 && a.x > G.cam - 20);
    if (G.banner && (G.banner.life -= dt) <= 0) G.banner = null;
    G.smoke = G.smoke.filter(s => s.life > 0);
    if (G.dead) return;

    // 速度隨距離慢慢加快
    G.speed = 190 + Math.min(240, G.cam * 0.012);
    G.cam += G.speed * dt;

    // 進入新的區域：跳出區域標題
    const zone = zoneAt(G.cam + heliX());
    if (zone > G.zone) {
      G.zone = zone;
      G.banner = { zone, life: 2.6 };
      tone(523, 0.18, 'triangle', 0.06); setTimeout(() => tone(784, 0.3, 'triangle', 0.06), 140);
    }

    // 環境粒子：依前方的場景產生
    const amb = sceneOf(zoneAt(G.cam + VW * 0.6)).ambient;
    if (amb && G.ambient.length < 50 && Math.random() < dt * 22) {
      const x = G.cam + rand(0, VW + 60);
      if (amb === 'snow') G.ambient.push({ kind: amb, x, y: rand(-10, VH * 0.4), vx: rand(-25, 0), vy: rand(18, 40), r: rand(1, 2.2), life: 7, max: 7 });
      if (amb === 'ember') G.ambient.push({ kind: amb, x, y: rand(VH * 0.55, VH), vx: rand(-10, 10), vy: rand(-60, -25), r: rand(1, 2), life: 3.5, max: 3.5 });
      if (amb === 'spore') G.ambient.push({ kind: amb, x, y: rand(20, VH - 20), vx: rand(-8, 8), vy: rand(-8, 8), r: rand(1.2, 2.4), life: rand(3, 6), max: 6, color: sceneColor(x, 'crystal') });
    }

    // 按住 → 往上推；放開 → 重力往下
    G.vy += (holding ? GRAVITY - LIFT : GRAVITY) * dt;
    G.vy = clamp(G.vy, MAX_UP, MAX_DOWN);
    G.y += G.vy * dt;

    // 排氣煙：按住時噴比較多
    if (Math.random() < (holding ? 0.9 : 0.35)) {
      G.smoke.push({ x: G.cam + heliX() - 20, y: G.y + 2, vx: -G.speed * 0.15, vy: rand(-10, 10), r: rand(2, 4), life: 0.8 });
    }

    ensureTerrain();

    // 碰撞：直升機機身簡化成一個矩形（旋翼不算，比較寬容），縮小時矩形也跟著變小
    const hx = G.cam + heliX();
    const k = G.mini > 0 ? MINI_SIZE : 1;
    const L = hx - 17 * k, R = hx + 15 * k, T = G.y - 8 * k, B = G.y + 10 * k;

    // 撿道具
    for (const it of G.items) {
      if (!it.taken && Math.hypot(it.x - hx, it.y - G.y) < 20) collect(it);
    }

    // 撞到洞頂、洞底
    for (const s of G.segs) {
      if (s.x + SEG < L || s.x > R) continue;
      if (T < s.top || B > s.bot) {
        if (G.inv > 0 || G.shield) {
          // 有護盾或無敵中：把直升機推回通道裡，而不是墜毀
          if (G.shield) breakShield(hx);
          if (T < s.top) { G.y = s.top + 8 * k + 1; G.vy = Math.max(G.vy, 40); }
          else { G.y = s.bot - 10 * k - 1; G.vy = Math.min(G.vy, -40); }
        } else return crash();
      }
    }
    // 撞到岩柱：有護盾的話岩柱會被撞碎
    for (const b of G.blocks) {
      if (b.broken || !(b.x < R && b.x + b.w > L && b.y < B && b.y + b.h > T)) continue;
      if (G.inv > 0) continue;
      if (G.shield) {
        breakShield(hx);
        b.broken = true;
        for (let i = 0; i < 24; i++) {
          G.debris.push({ x: b.x + rand(0, b.w), y: b.y + rand(0, b.h), vx: rand(0, 200), vy: rand(-150, 50), life: rand(0.5, 1), color: b.color });
        }
      } else return crash();
    }
    G.blocks = G.blocks.filter(b => !b.broken);
  }

  // ===== 繪圖 =====
  // 遠景岩壁：固定的形狀，用較慢速度捲動，做出景深
  const farRocks = Array.from({ length: 24 }, (_, i) => ({ x: i * 70 + rand(0, 40), y: rand(40, VH - 40), rx: rand(30, 70), ry: rand(20, 60) }));

  function drawBackground(cam) {
    const mid = cam + VW / 2;
    ctx.fillStyle = sceneColor(mid, 'bg');
    ctx.fillRect(0, -offY - 10, VW, VH + offY * 2 + 20);
    const par = cam * 0.3, period = 24 * 70;
    ctx.fillStyle = sceneColor(mid, 'far');
    for (const r of farRocks) {
      let x = ((r.x - par) % period + period) % period - 80;
      for (; x < VW + 80; x += period) {
        ctx.beginPath(); ctx.ellipse(x, r.y, r.rx, r.ry, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawWalls(cam) {
    const segs = G.segs;
    if (segs.length < 2) return;
    const top = -offY - 20, bottom = VH + offY + 20;
    // 洞頂與洞底：每段畫成一個四邊形（多 0.6 寬，避免段與段之間出現細縫）
    for (let i = 0; i < segs.length - 1; i++) {
      const a = segs[i], b = segs[i + 1];
      const x1 = a.x - cam, x2 = b.x - cam + 0.6;
      if (x2 < -2 || x1 > VW + 2) continue;
      ctx.fillStyle = a.wall;
      ctx.beginPath(); ctx.moveTo(x1, top); ctx.lineTo(x1, a.top); ctx.lineTo(x2, b.top); ctx.lineTo(x2, top); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x1, bottom); ctx.lineTo(x1, a.bot); ctx.lineTo(x2, b.bot); ctx.lineTo(x2, bottom); ctx.fill();
    }
    // 上下兩端加一點陰影，讓岩壁有厚度
    const shade = ctx.createLinearGradient(0, top, 0, bottom);
    shade.addColorStop(0, 'rgba(0,0,0,0.35)');
    shade.addColorStop(0.3, 'rgba(0,0,0,0)');
    shade.addColorStop(0.7, 'rgba(0,0,0,0)');
    shade.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = shade;
    ctx.fillRect(0, top, VW, bottom - top);
    // 岩壁邊緣的亮線
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < segs.length - 1; i++) {
      const a = segs[i], b = segs[i + 1];
      if (b.x - cam < -2 || a.x - cam > VW + 2) continue;
      ctx.strokeStyle = a.edge;
      ctx.beginPath(); ctx.moveTo(a.x - cam, a.top); ctx.lineTo(b.x - cam, b.top);
      ctx.moveTo(a.x - cam, a.bot); ctx.lineTo(b.x - cam, b.bot); ctx.stroke();
    }
  }

  function drawCrystals(cam) {
    ctx.save();
    ctx.shadowBlur = 10;
    for (const c of G.crystals) {
      const x = c.x - cam, dir = c.up ? 1 : -1;
      if (x < -20 || x > VW + 20) continue;
      ctx.fillStyle = ctx.shadowColor = c.color;
      // 洞頂上的晶石往下長，洞底的往上長
      const grow = c.y < VH / 2 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(x - c.s * 0.5, c.y);
      ctx.lineTo(x + dir * 2, c.y + grow * c.s * 1.6);
      ctx.lineTo(x + c.s * 0.5, c.y);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBlocks(cam) {
    for (const b of G.blocks) {
      const x = b.x - cam;
      if (x > VW + 40 || x + b.w < -40) continue;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, b.y, b.w, b.h, 6) : ctx.rect(x, b.y, b.w, b.h);
      ctx.fill();
      // 右半邊暗一點，做出立體感
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(x + b.w * 0.55, b.y + 3, b.w * 0.45 - 2, b.h - 6);
      ctx.strokeStyle = b.edge; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  function drawAmbient(cam) {
    for (const a of G.ambient) {
      const x = a.x - cam, fade = Math.min(1, a.life, (a.max - a.life) * 2);
      if (a.kind === 'snow') {
        ctx.fillStyle = `rgba(235,248,255,${0.75 * fade})`;
      } else if (a.kind === 'ember') {
        ctx.fillStyle = `rgba(255,${120 + Math.floor(a.life * 30)},40,${0.9 * fade})`;
      } else {
        ctx.globalAlpha = 0.7 * fade * (0.6 + Math.sin(G.t * 4 + a.x) * 0.4);
        ctx.fillStyle = a.color;
      }
      ctx.beginPath(); ctx.arc(x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // 進入新區域時，畫面上方出現「ZONE 02 / 冰晶洞窟」
  function drawBanner() {
    const b = G.banner;
    if (!b) return;
    const total = b.zone === 0 ? 2.2 : 2.6, age = total - b.life;
    const alpha = Math.min(1, age / 0.3, b.life / 0.6);
    const scene = sceneOf(b.zone);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.fillStyle = scene.edge;
    ctx.font = '700 12px "Chakra Petch", monospace';
    ctx.fillText(`ZONE ${String(b.zone + 1).padStart(2, '0')}`, VW / 2, 58);
    ctx.font = '900 26px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#efe6da';
    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 8;
    ctx.fillText(scene.name, VW / 2, 90);
    ctx.restore();
  }

  // 道具外觀：發光的圓，裡面畫各自的符號
  function drawItem(it, cam, t) {
    const def = ITEMS[it.type];
    const x = it.x - cam, y = it.y + Math.sin(t * 3 + it.p) * 4;
    if (x < -30 || x > VW + 30) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = def.color; ctx.shadowBlur = 14;
    ctx.strokeStyle = def.color; ctx.lineWidth = 2;
    ctx.fillStyle = '#15110fcc';
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = def.color; ctx.lineWidth = 1.8;
    ctx.beginPath();
    if (it.type === 'shield') {
      // 盾牌
      ctx.moveTo(0, -6); ctx.lineTo(5, -4); ctx.lineTo(4, 2); ctx.lineTo(0, 6); ctx.lineTo(-4, 2); ctx.lineTo(-5, -4); ctx.closePath(); ctx.fill();
    } else if (it.type === 'slow') {
      // 時鐘
      ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.moveTo(0, 0); ctx.lineTo(0, -4); ctx.moveTo(0, 0); ctx.lineTo(3, 1); ctx.stroke();
    } else {
      // 往內縮的箭頭
      ctx.moveTo(-6, -6); ctx.lineTo(-1.5, -1.5); ctx.moveTo(6, 6); ctx.lineTo(1.5, 1.5);
      ctx.moveTo(-1.5, -5); ctx.lineTo(-1.5, -1.5); ctx.lineTo(-5, -1.5);
      ctx.moveTo(1.5, 5); ctx.lineTo(1.5, 1.5); ctx.lineTo(5, 1.5); ctx.stroke();
    }
    ctx.restore();
  }

  function drawHeli(x, y, vy, t, size = 1) {
    const tilt = clamp(vy / 900, -0.28, 0.32);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);
    ctx.rotate(tilt);

    // 尾桁
    ctx.fillStyle = '#d9772a';
    ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(-30, -2); ctx.lineTo(-30, 1); ctx.lineTo(-6, 4); ctx.fill();
    // 尾翼與尾旋翼
    ctx.fillRect(-32, -8, 4, 9);
    const tr = Math.sin(t * 60) * 6;
    ctx.strokeStyle = '#efe6da'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-30, -4 - tr); ctx.lineTo(-30, -4 + tr); ctx.stroke();

    // 起落架
    ctx.strokeStyle = '#2a211c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, 11); ctx.lineTo(12, 11); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5, 6); ctx.lineTo(-6, 11); ctx.moveTo(6, 6); ctx.lineTo(7, 11); ctx.stroke();

    // 機身
    ctx.fillStyle = '#ff9a2e';
    ctx.beginPath(); ctx.ellipse(2, 0, 15, 8.5, 0, 0, Math.PI * 2); ctx.fill();
    // 座艙玻璃
    ctx.fillStyle = '#9fe6ef';
    ctx.beginPath(); ctx.ellipse(8, -2, 6.5, 5, 0, -Math.PI / 2, Math.PI / 2); ctx.fill();
    // 旋翼軸
    ctx.fillStyle = '#2a211c';
    ctx.fillRect(0, -12, 3, 5);
    // 主旋翼：用寬度變化模擬高速旋轉
    const blade = reduceMotion ? 22 : 6 + Math.abs(Math.sin(t * 38)) * 20;
    ctx.strokeStyle = '#efe6da'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(1.5 - blade, -12); ctx.lineTo(1.5 + blade, -12); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    if (!W) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // 切換到邏輯座標：縮放並把 360 高的遊戲區放在垂直中央
    ctx.setTransform(DPR * scale, 0, 0, DPR * scale, 0, DPR * scale * offY);
    if (G && G.shake > 0 && !reduceMotion) ctx.translate(rand(-6, 6) * G.shake, rand(-6, 6) * G.shake);

    if (!G) {
      // 標題畫面還沒有遊戲：先產生一段地形當背景
      newGame();
    }
    const cam = G.cam;
    drawBackground(cam);

    // 煙霧
    for (const s of G.smoke) {
      ctx.fillStyle = `rgba(190,175,160,${Math.max(0, s.life) * 0.25})`;
      ctx.beginPath(); ctx.arc(s.x - cam, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    drawBlocks(cam);
    drawWalls(cam);
    drawCrystals(cam);
    drawAmbient(cam);

    const t = G.t || performance.now() / 1000;
    for (const it of G.items) if (!it.taken) drawItem(it, cam, t);

    if (!G.dead) {
      const size = G.mini > 0 ? (G.mini < 1 ? MINI_SIZE + (1 - MINI_SIZE) * (1 - G.mini) : MINI_SIZE) : 1;
      // 護盾破掉後的無敵時間：機身閃爍
      const blink = G.inv > 0 && Math.floor(G.inv * 14) % 2 === 0;
      if (!blink) drawHeli(heliX(), G.y, G.vy, t, size);
      if (G.shield) {
        const pulse = 0.55 + Math.sin(t * 6) * 0.2;
        ctx.save();
        ctx.strokeStyle = ITEMS.shield.color;
        ctx.globalAlpha = pulse;
        ctx.lineWidth = 2;
        ctx.shadowColor = ITEMS.shield.color; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(heliX(), G.y - 1, 26 * size, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }

    // 碎片（爆炸、道具、岩柱）
    for (const p of G.debris) {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.color || (p.hot ? (p.life > 0.7 ? '#ffd27a' : '#ff9a2e') : '#5a4738');
      ctx.fillRect(p.x - cam - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // 吃到道具時浮起的文字
    ctx.font = '700 14px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    for (const p of G.popups) {
      ctx.globalAlpha = clamp(p.life * 1.5, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x - cam, p.y - 18);
    }
    ctx.globalAlpha = 1;

    drawBanner();

    // 慢動作時畫面蒙上一層淡紫
    if (G.slow > 0) {
      ctx.fillStyle = `rgba(150,120,255,${Math.min(0.12, G.slow * 0.1)})`;
      ctx.fillRect(0, -offY - 10, VW, VH + offY * 2 + 20);
    }
  }

  // ===== HUD =====
  const shown = {};
  function setHtml(el, key, v) { if (shown[key] !== v) { shown[key] = v; el.innerHTML = v; } }
  function updateHud() {
    if (!G) return;
    setHtml(ui.dist, 'dist', `${meters().toLocaleString()}<small>m</small>`);
    // 速度換算成看起來合理的 km/h：單位/秒 → 公尺/秒 → 公里/時
    const kmh = G.dead ? 0 : Math.round(G.speed / PX_PER_M * 3.6 * 4);
    setHtml(ui.speed, 'speed', `${kmh}<small>km/h</small>`);
    setHtml(ui.best, 'best', `${Math.max(best, meters()).toLocaleString()}<small>m</small>`);

    // 生效中的道具：顯示名稱與剩餘秒數
    const chips = [];
    if (!G.dead) {
      if (G.shield) chips.push(['shield', '']);
      if (G.slow > 0) chips.push(['slow', G.slow.toFixed(1) + 's']);
      if (G.mini > 0) chips.push(['mini', G.mini.toFixed(1) + 's']);
    }
    setHtml(ui.effects, 'effects', chips.map(([k, v]) =>
      `<span class="chip" style="--c:${ITEMS[k].color}"><i></i>${ITEMS[k].name}${v ? ` <b>${v}</b>` : ''}</span>`).join(''));
  }

  // ===== 主迴圈 =====
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (mode === 'play') { update(dt); updateHud(); }
    else if (mode === 'over' && G) update(dt);  // 讓碎片落完
    draw();
    requestAnimationFrame(frame);
  }

  // ===== 輸入：按住 = 上升 =====
  function press(e) {
    if (mode === 'title' || mode === 'over') {
      // 結算畫面出現後稍等一下，避免還按著就立刻重開
      if (mode === 'over' && performance.now() - overAt < 900) return;
      if (e && e.target && e.target.tagName === 'BUTTON') return;
      startGame();
    }
    if (mode === 'play') { holding = true; rotorUpdate(); }
  }
  function release() { holding = false; rotorUpdate(); }

  const stage = $('stage');
  stage.addEventListener('pointerdown', e => {
    // 點在按鈕、輸入框、說明卡片或排行榜上時，不要觸發起飛
    if (e.target.closest('button, input, form, .card, .board')) return;
    if (mode === 'pause') return;
    e.preventDefault();
    stage.setPointerCapture?.(e.pointerId);
    press(e);
  });
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('contextmenu', e => e.preventDefault());

  const UP_KEYS = [' ', 'ArrowUp', 'w', 'W'];
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;   // 正在輸入名字時，空白鍵、W 都是打字
    if (UP_KEYS.includes(e.key)) {
      e.preventDefault();
      if (e.repeat) return;
      if (document.activeElement?.tagName === 'BUTTON') document.activeElement.blur();
      press();
    }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  });
  window.addEventListener('keyup', e => { if (UP_KEYS.includes(e.key)) release(); });
  window.addEventListener('blur', () => { release(); if (mode === 'play' && !G.dead) setMode('pause'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !G.dead) setMode('pause'); });

  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);
  $('resumeBtn').addEventListener('click', togglePause);
  ui.pauseBtn.addEventListener('click', togglePause);
  ui.soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    ui.soundBtn.textContent = '音效：' + (soundOn ? '開' : '關');
    rotorUpdate();
  });

  // 手機上擋掉縮放手勢（iOS Safari 會無視部分 CSS 設定）
  document.addEventListener("gesturestart", e => e.preventDefault());
  document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });

  // ===== 啟動 =====
  function start(data) {
    best = Math.max(loadBest(), Number(data?.best) || 0);
    ui.best.innerHTML = `${best.toLocaleString()}<small>m</small>`;
    setMode('title');
    resize();
    renderBoards();
    loadStats();
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ best: Math.max(best, G ? meters() : 0) }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
